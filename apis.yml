aid: centralreach
name: CentralReach
description: >-
  CentralReach is a healthcare software and services platform for organizations
  that serve children and adults diagnosed with autism and related intellectual
  and developmental disabilities (IDD). Its integrated practice-management and
  electronic-medical-record (EMR) system covers clinical data collection,
  scheduling, note drafting and auditing, claims management and billing, staff
  training and certification, and caregiver engagement across ABA therapy,
  multidisciplinary therapy, and special-education providers. CentralReach
  publishes a gated Enhanced API (OAuth 2.0 client-credentials, JWT) at
  partners-api.centralreach.com for securely connecting the platform to critical
  third-party applications, with access provisioned through a dedicated
  CentralReach representative. Surfaced as a portfolio company of Insight
  Partners and enriched by the API Evangelist pipeline.
