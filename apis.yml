apis:
- name: CentralReach Enhanced API
  description: >-
    The CentralReach Enhanced API lets partner organizations connect securely to
    the CentralReach platform and integrate with third-party applications.
    Authentication is OAuth 2.0 client-credentials against the CentralReach
    identity provider (login.centralreach.com) returning a one-hour RS256 JWT;
    each request carries an organization-specific x-api-key plus a Bearer token.
    Access is provisioned by the CentralReach Implementation Team (client_id,
    client_secret, and API key). Base URL is the enterprise v1 namespace.
  humanURL: https://centralreach.com/resources/api/
  baseURL: https://partners-api.centralreach.com/enterprise/v1/
